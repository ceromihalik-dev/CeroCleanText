name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CeroCleanText.slnx
      - name: Build
        run: dotnet build CeroCleanText.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test CeroCleanText.slnx --configuration Release --no-build
