name: Windows Test Build

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test CeroCleanText.slnx --configuration Release
      - name: Publish Windows x64
        run: >
          dotnet publish src/CeroCleanText/CeroCleanText.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CeroCleanText-0.1.0-win-x64
          path: artifacts/win-x64/CeroCleanText.exe
          if-no-files-found: error
